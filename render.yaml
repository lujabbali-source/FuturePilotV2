# Despliegue en Render. Es un Blueprint: no toca ningun servicio que ya
# exista en la cuenta hasta que se crea explicitamente desde este archivo.
#
# Va en plan STARTER con disco persistente. Eso cuesta dinero al mes y es
# deliberado: en free no hay disco, la base SQLite vive dentro del contenedor
# y cada reinicio -Render los hace solo, al desplegar y tras un rato sin
# visitas- borraba TODAS las cuentas sin que fallara nada visible. Con eso no
# se puede pedirle a un acudiente que autorice nada, ni entregarle a un
# colegio un informe de resultados una semana despues, ni cobrar.
#
# Lo que el disco sostiene, y por eso esta activado todo junto:
#
#   - Las cuentas y los expedientes de consentimiento sobreviven al reinicio.
#   - El barrido de los 30 dias (CONSENT_SWEEP_ENABLED) tiene sentido: hay
#     expedientes que llegan a cumplirlos.
#   - La copia diaria (BACKUP_ENABLED) escribe donde no se borra sola.
#
# Al pasar a starter deja de hacer falta ADMIN_PASSWORD. Ver su comentario
# mas abajo: hay que borrarla del panel, pero solo DESPUES de comprobar que
# la cuenta de administrador sobrevive a un reinicio.

services:
  - type: web
    name: futurepilot
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /healthz

    # Todo lo que tiene que sobrevivir a un reinicio vive aqui debajo. 1 GB
    # es holgado para una SQLite de cuentas y sus copias; subirlo despues se
    # puede, bajarlo no.
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # Esta importa aunque no haya disco, y es gratis. Sin ella: /docs y
      # /openapi.json quedan publicos, y - lo serio - si un correo no sale,
      # su contenido se imprime en los logs. El de recuperacion de contraseña
      # lleva un token valido dentro.
      - key: FUTUREPILOT_ENV
        value: production

      # Las tres apuntan dentro del disco de arriba. Si alguna se quedara
      # fuera de /var/data volveria a vivir en el contenedor y se iria con el
      # siguiente reinicio, en silencio y sin que nada fallara.
      - key: USERS_DB_PATH
        value: /var/data/users.sqlite3
      - key: FUTUREPILOT_MEMORY_DIR
        value: /var/data/mentor
      - key: BACKUP_DIR
        value: /var/data/backups

      # Sin esto los enlaces que salen por correo se arman con la cabecera
      # Host de quien llama y con esquema http. Ver base_publica() en app.py.
      - key: PUBLIC_BASE_URL
        value: https://futurepilot-hp0v.onrender.com

      # El barrido de los 30 dias corre dentro de este mismo servicio, en un
      # hilo, porque los cron jobs de Render no pueden montar el disco.
      #
      # Encendido. Es lo que cumple la promesa que se le hace al acudiente en
      # su correo: si no responde, los datos del menor se borran. Apagado, esa
      # frase seria falsa, y ademas nadie se enteraria - un borrado que no
      # ocurre no da ningun error. Por eso /admin/system-health lo vigila y se
      # pone en rojo si deja de correr.
      - key: CONSENT_SWEEP_ENABLED
        value: "1"

      # La copia diaria corre en el mismo hilo-y-servicio y por el mismo
      # motivo. Encendida: escribe en BACKUP_DIR, que ahora esta dentro del
      # disco, asi que la copia ya no se borra con el mismo reinicio del que
      # pretende proteger.
      - key: BACKUP_ENABLED
        value: "1"

      # sync: false = Render las pide en el panel y no se guardan aqui. La
      # SMTP key y el correo del admin no pueden vivir en un archivo del
      # repositorio.
      - key: ADMIN_EMAIL
        sync: false

      # YA NO HACE FALTA, y hay que borrarla del panel: es una contraseña en
      # texto plano en la configuracion del despliegue. Existia porque sin
      # disco cada reinicio borraba la cuenta de admin y habia que volver a
      # crearla sola al arrancar.
      #
      # El orden importa, para no quedarse fuera: primero despliega con disco,
      # entra al panel de admin y comprueba que la cuenta sigue ahi despues de
      # un reinicio; SOLO ENTONCES borra la variable. Si se borrase antes y el
      # disco arrancara vacio, reclamar el asiento exigiria leer el token de
      # primer arranque en los logs de Render (ver admin_setup_token en
      # app.py) - se puede, pero es un mal rato evitable.
      #
      # La linea se deja aqui a proposito mientras tanto: quitarla del
      # Blueprint antes de tiempo no borra el valor del panel, solo hace que
      # deje de constar de donde salia.
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

# --------------------------------------------------------------------------
# El barrido de los 30 dias
# --------------------------------------------------------------------------
# Aqui deberia ir un `type: cron` con
# `python -m backend.consent_expiry --borrar`. No se puede: los cron jobs de
# Render corren en un contenedor aparte y no pueden montar un disco
# persistente, asi que no verian la base de datos.
#
#   https://render.com/docs/cronjobs
#
# La salida elegida es CONSENT_SWEEP_ENABLED, arriba: el barrido vive en un
# hilo del propio servicio web. Deja constancia en los logs de cada cuenta que
# borra y por orden de quien. Si alguna vez se despliega donde si haya cron,
# la linea de crontab sigue documentada en backend/consent_expiry.py y basta
# con apagar la variable.
