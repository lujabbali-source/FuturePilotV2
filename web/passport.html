<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#040a08">
  <title>Pasaporte FuturePilot</title>
  <link rel="stylesheet" href="/Frontend/passport.css">
</head>
<body>

  <div class="fp-bg" aria-hidden="true"></div>

  <!-- Sin indicador de carga: la cubierta es lo primero que se ve y no
       necesita datos para dibujarse. El nombre y el ID se rellenan cuando
       llega la respuesta, asi que no hay ni pantalla en blanco ni un
       spinner parpadeando por unos milisegundos. -->
  <main class="fp-passport" id="passportShell">

    <!-- El escenario aporta la perspectiva: sin ella el giro de la cubierta
         seria un simple encogimiento horizontal, no una tapa abriendose. -->
    <div class="fp-stage">
      <div class="fp-book" id="book" data-state="closed">

        <!-- PORTADA. Gira sobre su canto izquierdo para descubrir el
             interior. El reverso (fp-cover__inner) es la guarda que queda a
             la vista con el libro abierto. -->
        <button type="button" class="fp-cover" id="cover" aria-expanded="false"
                aria-controls="spread" aria-label="Abrir el pasaporte">
          <span class="fp-cover__face fp-cover__face--front">
            <span class="fp-cover__weave" aria-hidden="true"></span>
            <span class="fp-cover__circuit" aria-hidden="true"></span>

            <span class="fp-cover__crest" aria-hidden="true">
              <img src="/Frontend/futurepilot-logo-transparent.png" alt="">
            </span>

            <span class="fp-cover__wordmark">
              <em>FUTUREPILOT</em>
              <i>PASSPORT</i>
            </span>

            <span class="fp-cover__holder">
              <b id="coverName">—</b>
              <span class="fp-cover__ids">
                <span><small>ID</small><code id="coverId">—</code></span>
                <span><small>EMITIDO</small><code id="coverIssued">—</code></span>
              </span>
            </span>

            <span class="fp-cover__hint" id="coverHint">Toca para abrir</span>
          </span>

          <span class="fp-cover__face fp-cover__face--inner" aria-hidden="true">
            <span class="fp-cover__guard"></span>
          </span>
        </button>

        <!-- INTERIOR. Dos paginas en escritorio, una en movil. -->
        <div class="fp-spread" id="spread">
          <section class="fp-page fp-page--left" id="pageLeft" aria-live="polite"></section>
          <section class="fp-page fp-page--right" id="pageRight" aria-live="polite"></section>
          <div class="fp-spread__gutter" aria-hidden="true"></div>
        </div>

      </div>
    </div>

    <!-- Navegacion y salida. Siempre visibles con el libro abierto: nadie
         debe quedarse atrapado dentro de la experiencia. -->
    <nav class="fp-controls" id="controls" hidden>
      <button type="button" class="fp-controls__btn" id="prevPage" aria-label="Página anterior">←</button>
      <span class="fp-controls__meta" id="pageIndicator">—</span>
      <button type="button" class="fp-controls__btn" id="nextPage" aria-label="Página siguiente">→</button>
      <button type="button" class="fp-controls__close" id="closeBook">Cerrar pasaporte</button>
    </nav>

    <a class="fp-exit" href="/">← Volver al sitio</a>
  </main>

  <script type="module" src="/src/passport/main.js"></script>
</body>
</html>
