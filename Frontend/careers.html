<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FuturePilot Careers</title>

<link rel="stylesheet" href="/style.css">

<style>

body{
    background:#07111F;
    color:white;
}

.container{
    width:90%;
    max-width:1400px;
    margin:auto;
    padding:60px 0;
}

.title{
    text-align:center;
    margin-bottom:60px;
}

.title h1{

    font-size:4rem;

    background:linear-gradient(
        90deg,
        #00D4FF,
        #00FFB3
    );

    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
}

.title p{

    color:#B8C4D4;
    margin-top:10px;
}

.search-box{

    width:100%;

    padding:18px;

    border:none;

    border-radius:15px;

    background:rgba(255,255,255,.06);

    color:white;

    margin-bottom:40px;
}

.career-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:25px;
}

.career-card{

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    border-radius:20px;

    padding:25px;

    transition:.3s;
}

.career-card:hover{

    transform:translateY(-8px);

    border-color:#00FFB3;
}

.career-card h3{

    margin-bottom:15px;
}

.career-card p{

    color:#B8C4D4;
}

.build-btn{

    margin-top:20px;

    width:100%;

    border:none;

    padding:14px;

    border-radius:12px;

    cursor:pointer;

    font-weight:700;

    color:#07111F;

    background:linear-gradient(
        90deg,
        #00D4FF,
        #00FFB3
    );
}

</style>

</head>

<body>

<div class="container">

<div class="title">

<h1>Explore Careers</h1>

<p>
Choose a destination and build your Flight Plan.
</p>

</div>

<input
type="text"
class="search-box"
placeholder="Search careers..."
id="searchInput">

<div class="career-grid" id="careerGrid">

</div>

</div>

<script>

// Fuente unica de verdad: el catalogo de carreras vive en
// futurepilot-IA/data/careers.json y se sirve via /api/v1/careers.
// Antes esta pagina tenia su propio careerMap hardcodeado (con nombres
// que no coincidian con el catalogo real que usa la IA para el matching),
// lo que ademas causaba un ReferenceError porque 'careers' nunca se
// definia.
let careers = [];

const grid = document.getElementById("careerGrid");

function renderCareers(list){

grid.innerHTML="";

list.forEach(career=>{

grid.innerHTML += `

<div class="career-card">

<span style="color:#00FFB3;font-size:.8rem;text-transform:uppercase;">${career.category}</span>

<h3>${career.title}</h3>

<p>
${career.description}
</p>

<button
class="build-btn"
onclick="openCareer('${career.id}')">

Build My Flight Plan

</button>

</div>

`;

});

}

function openCareer(careerId){

const career = careers.find(c => c.id === careerId);
if(!career) return;

localStorage.setItem(
"selectedCareer",
career.title
);

window.location.href=
"/flightplan";

}

async function loadCareers(){

try {
    const response = await fetch("/api/v1/careers");
    const data = await response.json();
    careers = data.careers || [];
    renderCareers(careers);
} catch (error) {
    grid.innerHTML = "<p>No pudimos cargar el catalogo de carreras. Intenta recargar la pagina.</p>";
}

}

document
.getElementById("searchInput")
.addEventListener("input",e=>{

const search =
e.target.value.toLowerCase();

const filtered =
careers.filter(career=>

career.title.toLowerCase().includes(search) ||
career.category.toLowerCase().includes(search)

);

renderCareers(filtered);

});

loadCareers();

</script>
<script>
  (function () {
    var base = location.protocol === "file:" ? "./" : "/Frontend/";
    ["theme-loader.js", "i18n.js", "language-toggle.js", "passport-stamp-toast.js", "mentor-chat.js"].forEach(function (file) {
      document.write('<script src="' + base + file + '"><\/script>');
    });
  })();
</script>
</body>
</html>
