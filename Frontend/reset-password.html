<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#040a08">
  <meta name="robots" content="noindex, nofollow">
  <title>Restablecer contraseña · FuturePilot</title>
  <link rel="stylesheet" href="/Frontend/login.css">
</head>
<body>

  <div class="aurora-bg" aria-hidden="true">
    <span class="aurora-stars"></span>

    <svg class="aurora-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="auroraTurb1" x="-60%" y="-60%" width="220%" height="220%">
          <feTurbulence type="fractalNoise" baseFrequency="0.006 0.014" numOctaves="2" seed="5" result="n1"/>
          <feDisplacementMap in="SourceGraphic" in2="n1" scale="170" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="24"/>
        </filter>
        <filter id="auroraTurb2" x="-60%" y="-60%" width="220%" height="220%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="2" seed="11" result="n2"/>
          <feDisplacementMap in="SourceGraphic" in2="n2" scale="130" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="36"/>
        </filter>
        <filter id="auroraTurb3" x="-60%" y="-60%" width="220%" height="220%">
          <feTurbulence type="fractalNoise" baseFrequency="0.01 0.026" numOctaves="2" seed="19" result="n3"/>
          <feDisplacementMap in="SourceGraphic" in2="n3" scale="95" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="14"/>
        </filter>
        <filter id="auroraTurbFaint" x="-60%" y="-60%" width="220%" height="220%">
          <feTurbulence type="fractalNoise" baseFrequency="0.007 0.016" numOctaves="2" seed="27" result="n4"/>
          <feDisplacementMap in="SourceGraphic" in2="n4" scale="140" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="28"/>
        </filter>
        <radialGradient id="auroraCore" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#00ffb3" stop-opacity=".38"/>
          <stop offset="45%" stop-color="#00c896" stop-opacity=".2"/>
          <stop offset="100%" stop-color="#00c896" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="auroraMid" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#00d4ff" stop-opacity=".26"/>
          <stop offset="50%" stop-color="#00d4ff" stop-opacity=".12"/>
          <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="auroraOuter" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#baffe8" stop-opacity=".2"/>
          <stop offset="100%" stop-color="#baffe8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="auroraFaint" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#00c896" stop-opacity=".14"/>
          <stop offset="100%" stop-color="#00c896" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <g class="aurora-zone aurora-zone--main">
        <ellipse class="aurora-cloud aurora-cloud--a" cx="1120" cy="300" rx="480" ry="260" fill="url(#auroraOuter)" filter="url(#auroraTurb1)"/>
        <ellipse class="aurora-cloud aurora-cloud--b" cx="1200" cy="260" rx="340" ry="200" fill="url(#auroraMid)" filter="url(#auroraTurb2)"/>
        <ellipse class="aurora-cloud aurora-cloud--c" cx="1040" cy="340" rx="260" ry="150" fill="url(#auroraCore)" filter="url(#auroraTurb3)"/>
      </g>

      <g class="aurora-zone aurora-zone--secondary">
        <ellipse class="aurora-cloud aurora-cloud--d" cx="280" cy="650" rx="320" ry="180" fill="url(#auroraFaint)" filter="url(#auroraTurbFaint)"/>
      </g>
    </svg>
  </div>

  <main class="login-shell">

    <section class="login-brand">
      <a href="/" class="login-brand__logo">
        <img src="/Frontend/futurepilot-logo-transparent.png" alt="FuturePilot">
        <span class="login-brand__name">Future<span>Pilot</span></span>
      </a>
      <p class="login-brand__slogan">Build Your Future</p>
      <div class="login-brand__rule"><span></span></div>
      <p class="login-brand__copy">Descubre tu carrera ideal, explora universidades en todo el continente y construye el mapa hacia tu futuro — guiado por IA.</p>
    </section>

    <section class="login-card" id="resetCard">
      <p class="login-card__eyebrow"><span></span> FUTUREPILOT / ACCESO</p>
      <h1 class="login-card__title">Elige tu<span> nueva contraseña</span></h1>
      <p class="login-card__subtitle" id="resetSubtitle">Escribe una nueva contraseña para tu cuenta.</p>

      <div class="login-divider login-divider--top"><span></span></div>

      <form id="resetForm" class="login-form" novalidate>
        <label class="login-field">
          <span class="login-field__icon">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 10.5V8a4 4 0 1 1 8 0v2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <input type="password" name="password" autocomplete="new-password" required minlength="8" placeholder="Nueva contraseña (mínimo 8 caracteres)">
        </label>

        <label class="login-field">
          <span class="login-field__icon">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 10.5V8a4 4 0 1 1 8 0v2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <input type="password" name="confirmPassword" autocomplete="new-password" required minlength="8" placeholder="Confirma la nueva contraseña">
        </label>

        <p class="login-error" id="resetError" hidden></p>
        <p class="login-info" id="resetInfo" hidden></p>

        <button type="submit" class="login-submit" id="resetSubmit">
          <span id="resetSubmitLabel">Guardar nueva contraseña</span>
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12h15M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <p class="login-switch"><a href="/login" class="login-link login-link--strong">← Volver a iniciar sesión</a></p>
    </section>

  </main>

  <script>
    (function () {
      var base = location.protocol === "file:" ? "./" : "/Frontend/";
      ["theme-loader.js", "i18n.js", "language-toggle.js", "passport-stamp-toast.js", "mentor-chat.js", "reset-password.js"].forEach(function (file) {
        document.write('<script src="' + base + file + '"><\/script>');
      });
    })();
  </script>
</body>
</html>
