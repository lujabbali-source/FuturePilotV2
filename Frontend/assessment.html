<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FuturePilot Assessment</title>

<link rel="stylesheet" href="/Frontend/style.css">

<style>

body{
    background:#07111F;
    color:white;
    font-family:Arial, sans-serif;
    margin:0;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:1.4rem;
    font-weight:bold;
}

.logo span{
    color:#00D4FF;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
}

.nav-links a:hover{
    color:#00FFB3;
}

.assessment-container{

    max-width:900px;

    margin:80px auto;

    padding:40px;

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    border-radius:24px;

    backdrop-filter:blur(20px);
}

.assessment-container h1{

    text-align:center;

    margin-bottom:15px;

    font-size:3rem;

    background:linear-gradient(
        90deg,
        #00D4FF,
        #00FFB3
    );

    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.assessment-container p{

    text-align:center;

    color:#B8C4D4;

    margin-bottom:30px;
}

#progress-text{

    text-align:center;

    color:#B8C4D4;

    margin-bottom:15px;
}

.progress-container{

    width:100%;

    height:12px;

    background:rgba(255,255,255,.08);

    border-radius:999px;

    overflow:hidden;

    margin-bottom:40px;
}

.progress{

    width:0%;

    height:100%;

    border-radius:999px;

    background:linear-gradient(
        90deg,
        #00D4FF,
        #00FFB3
    );

    transition:.4s;
}

.question-card h2{

    margin-bottom:25px;

    text-align:center;
}

.answer-btn{

    width:100%;

    padding:18px;

    margin-bottom:12px;

    border:none;

    border-radius:14px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.08);

    color:white;

    cursor:pointer;

    font-size:1rem;

    transition:.3s;
}

.answer-btn:hover{

    border-color:#00FFB3;

    transform:translateY(-2px);

    box-shadow:
    0 0 20px rgba(0,255,179,.2);
}

@media(max-width:768px){

    nav{
        flex-direction:column;
        gap:15px;
    }

    .assessment-container{

        margin:30px 15px;

        padding:25px;
    }

    .assessment-container h1{

        font-size:2rem;
    }

}
.flight-title{

    color:#00FFB3;

    font-weight:700;

    font-size:1.1rem;

    margin-bottom:8px;
}

.flight-section{

    color:#00D4FF;

    margin-bottom:8px;

    font-size:.95rem;
}

.question-progress{

    color:#B8C4D4;
}

.selected-answer{

    border-color:#00FFB3 !important;

    transform:scale(1.03);

    box-shadow:
    0 0 25px rgba(0,255,179,.5),
    0 0 40px rgba(0,212,255,.3);
}

.fade-in{

    animation:fadeQuestion .35s ease;
}

@keyframes fadeQuestion{

    from{

        opacity:0;

        transform:
        translateY(15px);

    }

    to{

        opacity:1;

        transform:
        translateY(0);

    }

}

</style>

</head>

<body>

<nav>

<div class="logo">
FP <span>FuturePilot</span>
</div>

<div class="nav-links">

<a href="/">Home</a>

<a href="/careers">Careers</a>

<a href="/assessment">Assessment</a>

<a href="/roadmap">Roadmaps</a>

</div>

</nav>

<div class="assessment-container">

<h1>FuturePilot Assessment</h1>

<p>
Discover your strengths, interests and future opportunities.
</p>

<div id="progress-text">
Loading Questions...
</div>
<button
    id="back-btn"
    onclick="goBack()"
    style="
        margin-bottom:20px;
        padding:10px 18px;
        border:none;
        border-radius:12px;
        cursor:pointer;
        background:#00D4FF;
        color:#07111F;
        font-weight:bold;
    "
>
← Back
</button>

<div class="progress-container">

<div
id="progress-fill"
class="progress">
</div>

</div>

<div id="question-container">

Loading Questions...

</div>

</div>

<script src="/Frontend/assessment.js"></script>

</body>
</html>
