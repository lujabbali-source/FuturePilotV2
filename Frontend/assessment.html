<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111F">
  <title>Descubre tu perfil · FuturePilot</title>
  <script>
    // Cuando el backend sirve esta pagina en /assessment, las rutas
    // relativas (./assessment.css, ./assessment.js, ...) resuelven contra
    // la raiz del sitio en vez de contra Frontend/, y devuelven 404. Cuando
    // el archivo se abre directo con file://, en cambio, solo las rutas
    // relativas funcionan. Se resuelve la base una sola vez segun el modo.
    document.write(
      '<link rel="stylesheet" href="' +
      (location.protocol === "file:" ? "./assessment.css" : "/Frontend/assessment.css") +
      '">'
    );
  </script>
</head>
<body>
  <div class="ambient ambient--one"></div>
  <div class="ambient ambient--two"></div>
  <div id="assessment-app" aria-live="polite"></div>
  <script>
    (function () {
      var base = location.protocol === "file:" ? "./" : "/Frontend/";
      [
        "theme-loader.js",
        "i18n.js",
        "language-toggle.js",
        "passport-stamp-toast.js",
        "mentor-chat.js",
        "questions-data.js",
        "assessment-engine.js",
        "question-types.js",
        "assessment.js",
        "futurepilot-connector.js",
        "dev-config.js",
        "dev-tools.js",
      ].forEach(function (file) {
        document.write('<script src="' + base + file + '"><\/script>');
      });
    })();
  </script>
</body>
</html>
